[package]
name = "scar-forensics"
version = "0.1.0"
description = "SCAR — Surveillance Camera Analysis & Recovery"
edition = "2021"

[lib]
name = "scar_forensics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
